services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      PUBLIC_DEPLOYMENT: "true"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      ROADGUARD_DOMAIN: ${ROADGUARD_DOMAIN:?Set ROADGUARD_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
